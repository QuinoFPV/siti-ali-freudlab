# Ricostruisce il sito a ogni modifica (anche quelle fatte dal pannello)
# e lo pubblica come anteprima su GitHub Pages.
name: Anteprima su GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # ogni notte, così gli appuntamenti passati escono dalla home
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prefissa-base.mjs "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
