<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Anteprime · ALI Milano e Laboratorio freudiano</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.6 system-ui, sans-serif; background: #f6f5f3; color: #24262b; padding: 24px; box-sizing: border-box; }
    main { max-width: 640px; width: 100%; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p { margin: 0 0 24px; color: #6b6f78; }
    .siti { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
    a.sito { display: block; padding: 22px; background: #fff; border: 1px solid #e3ded8; border-radius: 6px; text-decoration: none; color: inherit; }
    a.sito:hover { border-color: currentColor; }
    a.sito strong { display: block; font-size: 1.1rem; }
    .ali strong { color: #8f1d21; } .fl strong { color: #0d3b70; }
    .pannello { display: inline-block; margin-top: 24px; color: #24262b; }
    @media (max-width: 520px) { .siti { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Anteprime dei nuovi siti</h1>
    <p>Versioni di prova, non indicizzate da Google.</p>
    <div class="siti">
      <a class="sito ali" href="ali-milano/"><strong>ALI Milano</strong>Associazione lacaniana internazionale</a>
      <a class="sito fl" href="freudlab/"><strong>Laboratorio freudiano</strong>Scuola di specializzazione in psicoterapia</a>
    </div>
    <a class="pannello" href="ali-milano/admin/">Pannello di modifica (unico per i due siti) →</a>
  </main>
</body>
</html>
