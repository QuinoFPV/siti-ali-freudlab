# Configurazione del pannello di modifica (Sveltia CMS), unico per i due siti.
# Ogni "collection" è una sezione del pannello; ogni "field" è un campo del modulo.
# Appuntamenti, pubblicazioni e documenti sono condivisi: il campo "Pubblica su"
# decide su quale sito compaiono. Pagine e impostazioni sono di ciascun sito.

backend:
  name: github
  repo: QuinoFPV/siti-ali-freudlab
  branch: main
  commit_messages:
    create: 'Nuovo {{collection}}: {{slug}}'
    update: 'Modifica {{collection}}: {{slug}}'
    delete: 'Eliminato {{collection}}: {{slug}}'
    uploadMedia: 'Caricato {{path}}'
    deleteMedia: 'Eliminato {{path}}'

logo:
  src: /uploads/2022/01/logo_menu-1.jpg

# Dove finiscono immagini e PDF caricati dal pannello
media_folder: pubblico/uploads/pannello
public_folder: /uploads/pannello

collections:
  # ——— Contenuti comuni ai due siti ———

  - name: eventi
    label: Appuntamenti
    label_singular: Appuntamento
    description: Seminari, giornate di studio e presentazioni. Scegli in "Pubblica su" su quale sito compaiono.
    folder: contenuti/eventi
    create: true
    slug: '{{titolo}}'
    identifier_field: titolo
    summary: '{{inizio}} · {{titolo}}'
    sortable_fields: [inizio, titolo]
    view_filters:
      - { label: Solo ALI Milano, field: siti, pattern: ali-milano }
      - { label: Solo Freudlab, field: siti, pattern: freudlab }
    fields:
      - { name: titolo, label: Titolo, widget: string }
      - &siti
        name: siti
        label: Pubblica su
        widget: select
        multiple: true
        min: 1
        default: [ali-milano]
        options:
          - { label: ALI Milano, value: ali-milano }
          - { label: Laboratorio freudiano (Freudlab), value: freudlab }
      - name: inizio
        label: Inizio
        widget: datetime
        format: 'YYYY-MM-DD[T]HH:mm'
        picker_utc: false
      - name: fine
        label: Fine
        widget: datetime
        format: 'YYYY-MM-DD[T]HH:mm'
        picker_utc: false
        required: false
      - { name: tutto_il_giorno, label: Tutto il giorno, widget: boolean, required: false, default: false }
      - { name: luogo, label: Luogo, widget: string, required: false, default: Sede Laboratorio Freudiano }
      - { name: indirizzo, label: Indirizzo, widget: string, required: false, default: 'Piazza Aspromonte 13, Milano' }
      - { name: online, label: 'Collegamento online (Zoom, streaming…)', widget: string, required: false }
      - { name: locandina, label: Locandina, widget: image, required: false }
      - { name: body, label: Descrizione, widget: markdown, required: false }
      - { name: vecchio_url, label: Indirizzo sul vecchio sito, widget: hidden }

  - name: pubblicazioni
    label: Pubblicazioni
    label_singular: Pubblicazione
    description: Libri, articoli, seminari, dossier, editoriali.
    folder: contenuti/pubblicazioni
    create: true
    slug: '{{titolo}}'
    identifier_field: titolo
    summary: '{{titolo}} ({{categoria}})'
    sortable_fields: [data, titolo]
    view_groups:
      - { label: Categoria, field: categoria }
    view_filters:
      - { label: Solo ALI Milano, field: siti, pattern: ali-milano }
      - { label: Solo Freudlab, field: siti, pattern: freudlab }
    fields:
      - { name: titolo, label: Titolo, widget: string }
      - *siti
      - { name: data, label: Data di pubblicazione, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - name: categoria
        label: Categoria
        widget: select
        options:
          - { label: Libri, value: libri }
          - { label: Articoli, value: articoli }
          - { label: Seminari, value: seminari }
          - { label: Dossier, value: dossier }
          - { label: Editoriale e testi, value: editoriale }
      - { name: immagine, label: Immagine o copertina, widget: image, required: false }
      - { name: riassunto, label: Riassunto (per le anteprime), widget: text, required: false }
      - { name: body, label: Testo, widget: markdown }
      - { name: vecchio_url, label: Indirizzo sul vecchio sito, widget: hidden }

  - name: documenti
    label: Documenti
    label_singular: Documento
    description: PDF da scaricare (relazioni, testi dei seminari…). Oggi compaiono nella pagina Consultorio di ALI Milano.
    folder: contenuti/documenti
    create: true
    slug: '{{titolo}}'
    identifier_field: titolo
    fields:
      - { name: titolo, label: Titolo, widget: string }
      - *siti
      - { name: autore, label: Autore, widget: string, required: false }
      - { name: data, label: Data, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: file, label: File PDF, widget: file }
      - name: sezione
        label: Pagina in cui compare
        widget: select
        default: consultorio
        options:
          - { label: Consultorio, value: consultorio }
      - { name: body, label: Descrizione, widget: markdown, required: false }

  # ——— ALI Milano ———

  - name: pagine-ali
    label: 'ALI Milano · Pagine'
    label_singular: Pagina
    description: Chi siamo, statuto, storico, consultorio, introduzione alla psicoanalisi.
    folder: contenuti/ali-milano/pagine
    create: false
    delete: false
    identifier_field: titolo
    fields: &campi_pagina
      - { name: titolo, label: Titolo, widget: string }
      - { name: sottotitolo, label: Sottotitolo, widget: string, required: false }
      - { name: ordine, label: Ordine, widget: hidden }
      - { name: body, label: Testo, widget: markdown }

  - name: impostazioni-ali
    label: 'ALI Milano · Impostazioni'
    description: Home page, contatti, soci e locandine di ALI Milano.
    files:
      - name: home
        label: Home page
        file: contenuti/ali-milano/impostazioni/home.json
        fields:
          - { name: titolo, label: Titolo principale, widget: string }
          - { name: introduzione, label: Testo di presentazione, widget: markdown }
          - { name: immagine, label: Immagine, widget: image }
          - { name: consultorio_titolo, label: Titolo del riquadro Consultorio, widget: string }
          - { name: consultorio_testo, label: Testo del riquadro Consultorio, widget: markdown }
      - name: sito
        label: Contatti e link
        file: contenuti/ali-milano/impostazioni/sito.json
        fields:
          - { name: nome, label: Nome dell’associazione, widget: string }
          - { name: sigla, label: Sigla, widget: string }
          - { name: descrizione, label: Descrizione per Google, widget: text }
          - { name: indirizzo, label: Indirizzo, widget: string }
          - { name: come_arrivare, label: Come arrivare, widget: string }
          - { name: telefono, label: Telefono, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: email_consultorio, label: Email del Consultorio, widget: string }
          - { name: consultorio_roma, label: Nota sul Consultorio di Roma, widget: string, required: false }
          - { name: mappa, label: Link alla mappa, widget: string }
          - { name: modulo_contatti, label: Indirizzo del servizio moduli (es. Formspree), widget: string, required: false }
          - &social { name: social, label: Social, widget: list, fields: [{ name: nome, label: Nome, widget: string }, { name: url, label: Indirizzo, widget: string }] }
          - &link_utili { name: link_utili, label: Link utili, widget: list, fields: [{ name: nome, label: Nome, widget: string }, { name: url, label: Indirizzo, widget: string }] }
      - name: soci
        label: Soci
        file: contenuti/ali-milano/impostazioni/soci.json
        fields:
          - name: soci
            label: Soci
            widget: list
            summary: '{{nome}}'
            fields:
              - { name: nome, label: Nome e cognome, widget: string }
              - { name: email, label: Email, widget: string, required: false }
              - { name: citta, label: Città, widget: string, required: false }
      - name: locandine
        label: Locandine
        file: contenuti/ali-milano/impostazioni/locandine.json
        fields:
          - name: locandine
            label: Locandine
            widget: list
            summary: '{{titolo}}'
            fields:
              - { name: titolo, label: Titolo, widget: string }
              - { name: immagine, label: Immagine, widget: image }

  # ——— Laboratorio freudiano ———

  - name: pagine-freudlab
    label: 'Freudlab · Pagine'
    label_singular: Pagina
    description: La scuola, piano di studi, ammissione, collana Nodi, introduzione alla psicoanalisi.
    folder: contenuti/freudlab/pagine
    create: false
    delete: false
    identifier_field: titolo
    fields: *campi_pagina

  - name: impostazioni-freudlab
    label: 'Freudlab · Impostazioni'
    description: Home page, contatti, docenti e video del Laboratorio freudiano.
    files:
      - name: home
        label: Home page
        file: contenuti/freudlab/impostazioni/home.json
        fields:
          - { name: titolo, label: Titolo principale, widget: string }
          - { name: sottotitolo, label: Sottotitolo, widget: text }
          - { name: immagine, label: Immagine principale, widget: image }
          - { name: scuola_titolo, label: Titolo del riquadro La scuola, widget: string }
          - { name: scuola_testo, label: Testo del riquadro La scuola, widget: markdown }
          - { name: scuola_immagine, label: Foto del riquadro La scuola, widget: image }
          - { name: citazione, label: Citazione, widget: text }
          - { name: citazione_autore, label: Autore della citazione, widget: string }
      - name: sito
        label: Contatti e link
        file: contenuti/freudlab/impostazioni/sito.json
        fields:
          - { name: nome, label: Nome della scuola, widget: string }
          - { name: sigla, label: Sigla, widget: string }
          - { name: descrizione, label: Descrizione per Google, widget: text }
          - { name: indirizzo, label: Indirizzo, widget: string }
          - { name: come_arrivare, label: Come arrivare, widget: string }
          - { name: telefono, label: Telefono, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: direttore, label: Direttore, widget: string }
          - { name: telefono_direttore, label: Telefono del direttore, widget: string, required: false }
          - { name: email_direttore, label: Email del direttore, widget: string, required: false }
          - name: sede_roma
            label: Sede di Roma
            widget: object
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: indirizzo, label: Indirizzo, widget: string }
              - { name: telefono, label: Telefono, widget: string }
              - { name: email, label: Email, widget: string }
              - { name: sito, label: Sito, widget: string }
              - { name: direttore, label: Direttore, widget: string }
          - { name: mappa, label: Link alla mappa, widget: string }
          - { name: modulo_contatti, label: Indirizzo del servizio moduli (es. Formspree), widget: string, required: false }
          - { name: newsletter, label: Indirizzo del servizio newsletter, widget: string, required: false }
          - *social
          - *link_utili
      - name: docenti
        label: Docenti
        file: contenuti/freudlab/impostazioni/docenti.json
        fields:
          - { name: direttore, label: Direttore responsabile, widget: string }
          - { name: segretario, label: Segretario, widget: string }
          - name: docenti
            label: Docenti
            widget: list
            summary: '{{nome}}'
            fields:
              - { name: nome, label: Nome e cognome, widget: string }
              - { name: ruolo, label: Professione, widget: string }
              - { name: nota, label: Incarico o città, widget: string, required: false }
              - { name: visiting, label: Visiting professor, widget: boolean, required: false, default: false }
      - name: video
        label: Video
        file: contenuti/freudlab/impostazioni/video.json
        fields:
          - name: video
            label: Video
            widget: list
            summary: '{{titolo}}'
            fields:
              - { name: titolo, label: Titolo, widget: string }
              - { name: youtube, label: Codice del video YouTube (la parte dopo v= nell’indirizzo), widget: string }
              - { name: nota, label: Descrizione, widget: text, required: false }
